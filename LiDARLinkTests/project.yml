name: LiDARLinkTests
options:
  bundleIdPrefix: com.lidarlink
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ARCHS: arm64
targets:
  LiDARLinkTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LiDARLinkTests
    dependencies:
      - package: LiDARLinkShared
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lidarlink.LiDARLinkTests
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "LiDARLinkTests connects to a loopback listener to verify the streaming protocol."
        INFOPLIST_KEY_NSBonjourServices: "_lidarlink._tcp"
packages:
  LiDARLinkShared:
    path: ../LiDARLinkShared
schemes:
  LiDARLinkTests:
    build:
      targets:
        LiDARLinkTests: all
    test:
      targets:
        - LiDARLinkTests
